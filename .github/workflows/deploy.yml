name: Test and deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the reference library
        run: pip install -e './python[dev]'
      - name: Python test suite
        run: pytest python/tests -q
      - name: Golden cross-tests (JS must match Python byte-for-byte)
        run: node web/test/golden.mjs
      - name: Ticker tests
        run: node web/test/ticker.mjs

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://clock.cartercole.net/
    steps:
      - uses: actions/checkout@v4
      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Upload to S3 and invalidate the CDN
        run: scripts/deploy.sh
